name: Publish benchmark
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate the published snapshot
        run: |
          python3 tools/validate_data.py
          python3 -m unittest discover -s tools -p 'test_pages_artifact.py'
          python3 -m unittest discover -s tools -p 'test_prediction_gallery.py'
          python3 -m unittest discover -s tools -p 'test_followup_results.py'
          python3 -m unittest discover -s tools -p 'test_her2_campaigns.py'
          python3 -m unittest discover -s tools -p 'test_publication_policy.py'
      - name: Check exploratory chart semantics
        run: node --test tools/test_*semantics.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5.0.0
        id: pages_artifact
        with:
          path: dist
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the uploaded artifact to be discoverable
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: bash tools/wait_for_pages_artifact.sh
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
